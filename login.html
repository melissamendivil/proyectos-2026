<!DOCTYPE html>
<html lang="es">
<head>
    <title>Camp Wildfire - Login</title>
    <meta charset="utf-8">
    <meta name="description" content="Campamento para niños y niñas">
    <meta name="keywords" content="Campamento de verano, overnight, Tradicional">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header id="menú">
        <video autoplay muted loop id="myVideo">
            <source src="/Users/melissamendivilvillarreal/Desktop/camp wildfire/imagenes/Adobe Express - video niños.mp4" type="video/mp4">
        </video>
        <nav class="nav-desk">
            <a href="index.html" class="logo-link">
                <img src="imagenes/logo%20blanco.png" alt="Camp Wildfire" class="main-logo">
            </a>
            <a href="filosofia.html" class="navbar-item">About Us</a>
            <a href="Explora el Camp" class="navbar-item">Explore Camp</a>
            <a href="Trabaja con nosotros" class="navbar-item">Work at Camp</a>
            <a href="login.html" class="navbar-item">Families</a>
        </nav>
        <nav class="nav-mob">
            <a href="index.html" class="logo-link">
                <img src="imagenes/logo%20blanco.png" alt="Camp Wildfire" class="mob-logo">
            </a>
            <button class="menu-btn"
                    onclick="toggleMenu()"
                    aria-label="Abrir menú"
                    aria-expanded="false">
                <img src="imagenes/menu.png"
                     alt=""
                     class="img-menu">
            </button>
            <ul class="mob-menu" id="mobMenu">
                <li><a href="filosofia.html" onclick="closeMenu()">About Us</a></li>
                <li><a href="Explora el camp" onclick="closeMenu()">Explore Camp</a></li>
                <li><a href="Trabaja con nosotros" onclick="closeMenu()">Work at Camp</a></li>
                <li><a href="login.html" onclick="closeMenu()">Families</a></li>
            </ul>
        </nav>
        <main class="login-wrapper">
            <div class="login-card">
                <h2>Log in</h2>
                <p class="login-subtitle">Welcome back, please login to your account</p>
                
                <form class="login-form">
                    <div class="form-group">
                        <label for="email">User Name</label>
                        <input type="text" id="email" placeholder="Correo o usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="login-footer">
                    <p>Don't have an account? <a href="#">Signup</a></p>
                </div>
            </div>
        </main>
    </header>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobMenu');
            const button = document.querySelector('.menu-btn');
            menu.classList.toggle('active');
            const expanded = menu.classList.contains('active');
            button.setAttribute('aria-expanded', expanded);
        }

        function closeMenu() {
            const menu = document.getElementById('mobMenu');
            menu.classList.remove('active');
        }
    </script>
</body>
</html>
