      margin-top: 30px;
    }

    hr {
      margin: 20px 0;
      border: 0;
      border-top: 2px solid #ccc;

    .grid-container {
      display: grid;

    .box {
      background-color: #4a2d8b;

    .col-4 {

    }

    .col-5 {
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    }

    .col-2fr-1fr {

    }

    .col-1fr-2fr {

    }
  </style>
</head>
